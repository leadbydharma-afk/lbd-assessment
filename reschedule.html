<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://cyguqfqmnjtjoztcjres.supabase.co; img-src 'self' data:; object-src 'none';">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead By Dharma — Reschedule Your Session</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--navy:#1a3a5c;--navy2:#0d1f35;--gold:#c9a84c;--cream:#faf5e8;--cream2:#f0e8d0;--ink:#1a1a14;--ash:#7a7a6a;--green:#1a5c2e;--red:#8b1a1a;--amber:#8b5c00;--white:#ffffff;--border:rgba(26,58,92,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--cream);color:var(--ink);min-height:100vh}
.hdr{background:var(--navy2);padding:2rem 1.5rem 1.5rem;text-align:center;border-bottom:4px solid var(--gold)}
.hdr h1{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,4vw,2.2rem);color:var(--white)}
.hdr h1 span{color:var(--gold)}
.wrap{max-width:640px;margin:0 auto;padding:1.5rem 1.2rem 4rem}
.btn{font-family:'Playfair Display',serif;font-size:1.15rem;padding:.7rem 1.6rem;border:none;cursor:pointer;border-radius:2px}
.btn-primary{background:var(--navy);color:var(--gold);border:1px solid var(--navy)}
.btn-primary:hover{background:var(--navy2)}
.inp{width:100%;padding:.7rem .9rem;font-family:'Crimson Pro',serif;font-size:1.1rem;border:1.5px solid var(--border);border-radius:2px;background:var(--cream);color:var(--ink);outline:none}
.inp:focus{border-color:var(--navy)}
.card{background:var(--white);border:1px solid var(--border);border-radius:3px;padding:1.6rem;margin:1.2rem 0}
.card h3{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--navy);margin-bottom:1rem}
.hidden{display:none}
.date-list{display:flex;flex-direction:column;gap:.6rem;margin:1rem 0}
.date-item{background:var(--cream);border:1.5px solid var(--border);border-radius:2px;padding:.9rem 1.1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.date-item:hover:not(.full){border-color:var(--navy);background:var(--white)}
.date-item.full{opacity:.5;cursor:not-allowed;background:#e8e4d8}
.di-label{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--navy);font-weight:600}
.di-time{font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--ash)}
.di-seats{font-family:'JetBrains Mono',monospace;font-size:.9rem;color:var(--green)}
.di-full-label{font-family:'JetBrains Mono',monospace;font-size:.9rem;color:var(--red)}
.notice{padding:1.2rem 1.4rem;border-radius:3px;margin-bottom:1rem;font-size:1.02rem;line-height:1.6}
.notice.blocked{background:rgba(139,26,26,.06);border:1px solid rgba(139,26,26,.2);color:var(--red)}
.notice.info{background:rgba(26,58,92,.06);border:1px solid var(--border);color:var(--navy)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="hdr">
  <h1>Reschedule Your <span>Session</span></h1>
</div>
<div class="wrap">

<div id="emailStep" class="card">
  <h3>Enter Your Email</h3>
  <p style="font-size:1.02rem;color:var(--ash);font-style:italic;margin-bottom:1rem">The email you used to book your session.</p>
  <input class="inp" id="candEmail" type="email" placeholder="Your email address..." onkeydown="if(event.key==='Enter') checkEligibility()"/>
  <div style="text-align:right;margin-top:1rem">
    <button class="btn btn-primary" onclick="checkEligibility()">Check →</button>
  </div>
</div>

<div id="blockedNotice" class="hidden"></div>

<div id="rescheduleFlow" class="hidden">
  <div class="notice info" id="currentBookingInfo"></div>
  <div class="card">
    <h3 id="dateStepTitle">Select a New Date</h3>
    <div class="date-list" id="dateList"></div>
  </div>
</div>

</div>

<script>
const supabaseUrl = 'https://cyguqfqmnjtjoztcjres.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5Z3VxZnFtbmp0am96dGNqcmVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMTcwMzEsImV4cCI6MjA5Mzc5MzAzMX0.sCi_iXTN18gVjXIQPqewpAjVRmM2gSgMKJpYsV1m7QM';
const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

var candidateEmail = '';
var currentSessionType = '';

async function checkEligibility() {
  var email = document.getElementById('candEmail').value.trim();
  if (!email || email.indexOf('@') < 1) { alert('Please enter a valid email address.'); return; }
  candidateEmail = email;

  const { data, error } = await _supabase.rpc('check_reschedule_eligibility', { input_email: email });
  if (error) { alert('System error. Please try again or contact leadbydharma@gmail.com'); return; }

  var result = data && data[0];
  document.getElementById('emailStep').classList.add('hidden');

  if (!result || !result.eligible) {
    var notice = document.getElementById('blockedNotice');
    notice.classList.remove('hidden');
    notice.innerHTML = '<div class="notice blocked"><strong>Unable to reschedule automatically.</strong><br>' + (result ? result.reason : 'No booking found.') + '<br><br>Contact us directly: <a href="mailto:leadbydharma@gmail.com">leadbydharma@gmail.com</a> or WhatsApp <a href="https://wa.me/919878930879">+91 98789 30879</a>.</div>';
    return;
  }

  currentSessionType = result.session_type;
  var dLabel = new Date(result.session_date + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('currentBookingInfo').innerHTML = 'Your current <strong>' + (currentSessionType === 'group' ? 'Group' : 'Individual') + ' Session</strong> is booked for <strong>' + dLabel + '</strong>. Select a new date below — this uses your one free reschedule.';
  document.getElementById('rescheduleFlow').classList.remove('hidden');
  renderDateStep();
}

function getUpcomingWeekdays(dayNumbers, windowDays) {
  var result = [];
  var today = new Date();
  for (var i = 0; i < windowDays; i++) {
    var d = new Date(today);
    d.setDate(today.getDate() + i);
    if (dayNumbers.indexOf(d.getDay()) !== -1) result.push(d.toISOString().split('T')[0]);
  }
  return result;
}
function formatDateLabel(iso) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
}
function formatTimeRange(start, end) {
  function fmt(t) {
    var p = t.split(':'); var h = parseInt(p[0], 10); var m = p[1];
    var ap = h >= 12 ? 'pm' : 'am'; var h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + (m !== '00' ? ':' + m : '') + ap;
  }
  return fmt(start) + '\u2013' + fmt(end);
}

async function renderDateStep() {
  var list = document.getElementById('dateList');
  list.innerHTML = '<div style="text-align:center;color:var(--ash);font-style:italic">Loading available dates...</div>';

  if (currentSessionType === 'group') {
    document.getElementById('dateStepTitle').textContent = 'Select a New Group Session Date';
    var dates = getUpcomingWeekdays([2, 4], 14);

    var overridesRes = await fetch(supabaseUrl + '/rest/v1/group_session_overrides?select=*', { headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey } });
    var overrides = await overridesRes.json();
    var overrideMap = {}; (overrides || []).forEach(function(o) { overrideMap[o.session_date] = o; });

    var seatsRes = await fetch(supabaseUrl + '/rest/v1/group_session_seats?select=*', { headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + supabaseKey } });
    var seats = await seatsRes.json();
    var seatMap = {}; (seats || []).forEach(function(s) { seatMap[s.session_date] = s.seats_taken; });

    var html = '';
    dates.forEach(function(d) {
      var override = overrideMap[d];
      if (override && override.is_cancelled) return;
      var capacity = (override && override.capacity) || 30;
      var startT = (override && override.start_time) || '17:30';
      var endT = (override && override.end_time) || '20:30';
      var taken = seatMap[d] || 0;
      var remaining = capacity - taken;
      var isFull = remaining <= 0;
      var seatsLabel = remaining <= 15
        ? '<div class="di-seats' + (remaining <= 5 ? '" style="color:var(--amber)' : '') + '">' + remaining + ' seats left</div>'
        : '<div class="di-seats">Few seats left</div>';
      html += '<div class="date-item' + (isFull ? ' full' : '') + '" ' + (isFull ? '' : 'onclick="confirmReschedule(\'' + d + '\')"') + '>'
        + '<div><div class="di-label">' + formatDateLabel(d) + '</div><div class="di-time">' + formatTimeRange(startT, endT) + '</div></div>'
        + (isFull ? '<div class="di-full-label">FULLY BOOKED</div>' : seatsLabel)
        + '</div>';
    });
    list.innerHTML = html || '<div style="color:var(--ash);font-style:italic">No upcoming dates available.</div>';

  } else {
    document.getElementById('dateStepTitle').textContent = 'Select a New Date & Time';
    var dates = getUpcomingWeekdays([1, 3, 5], 14);
    var slots = [{ start: '10:00', end: '11:30', label: '10:00\u201311:30am' }, { start: '17:30', end: '19:00', label: '5:30\u20137:00pm' }, { start: '19:30', end: '21:00', label: '7:30\u20139:00pm' }];
    var html = '';
    dates.forEach(function(d) {
      slots.forEach(function(s) {
        html += '<div class="date-item" onclick="confirmReschedule(\'' + d + '\')">'
          + '<div><div class="di-label">' + formatDateLabel(d) + '</div><div class="di-time">' + s.label + '</div></div>'
          + '</div>';
      });
    });
    list.innerHTML = html;
  }
}

async function confirmReschedule(newDate) {
  if (!confirm('Confirm reschedule to ' + formatDateLabel(newDate) + '? This uses your one free reschedule.')) return;

  const { data, error } = await _supabase.rpc('self_service_reschedule', { input_email: candidateEmail, p_new_date: newDate });
  if (error) { alert('System error. Please try again or contact leadbydharma@gmail.com'); return; }

  var result = data && data[0];
  if (!result || !result.success) {
    alert(result ? result.message : 'Could not reschedule. Please try again.');
    if (result && result.message && result.message.indexOf('full') !== -1) renderDateStep();
    return;
  }

  document.getElementById('rescheduleFlow').innerHTML = '<div class="notice info" style="background:rgba(26,92,46,.06);border-color:rgba(26,92,46,.2);color:var(--green)"><strong>✓ Rescheduled.</strong><br>Your session is now confirmed for ' + formatDateLabel(newDate) + '. A confirmation will follow — if you don\'t hear back, WhatsApp +91 98789 30879.</div>';
}
</script>
</body>
</html>
